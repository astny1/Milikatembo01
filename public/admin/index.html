<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Content Manager | Milika Tembo</title>
    <link rel="stylesheet" href="/admin/admin.css" />
    <script>
      (function () {
        var theme = localStorage.getItem('milika-admin-theme') || 'day';
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  </head>
  <body>
    <header class="admin-chrome">
      <div class="admin-welcome">
        <span class="admin-welcome-name">Welcome back, Milika Tembo</span>
        <span class="admin-welcome-time" data-welcome-time></span>
      </div>
      <button type="button" class="account-launch" id="account-launch">Account settings</button>
    </header>
    <div id="nc-root"></div>
    <script>
      window.CMS_MANUAL_INIT = true;
    </script>
    <script src="https://unpkg.com/decap-cms@^3.6.2/dist/decap-cms.js"></script>
    <script src="/admin/account.js"></script>
    <script src="/admin/editor-actions.js"></script>
    <script src="/admin/welcome.js"></script>
  </body>
</html>
